[project]
name = "pole-attached-tray"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anekos", email = "anekos@snca.net" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
app = "pole_attached_tray:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pole_attached_tray"]

[dependency-groups]
dev = [
    "cadquery>=2.8.0",
    "click>=8.4.2",
    "click-cadquery>=0.4.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
